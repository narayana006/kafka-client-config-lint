name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest -q
      - name: Run on examples
        run: |
          kafka-client-config-lint examples/producer.properties --kafka-version 3.7 --fail-on never
          kafka-client-config-lint examples/consumer.properties examples/application.properties --processing-ms 800 --format json --fail-on never
          kafka-client-config-lint examples/producer-durable.properties
