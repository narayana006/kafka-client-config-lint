[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kafka-client-config-lint"
version = "0.1.0"
description = "Lint Kafka producer and consumer configs against durability, latency or throughput profiles"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Narayana Vemburaj" }]
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: System :: Systems Administration",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
kafka-client-config-lint = "kafka_client_config_lint.cli:main"

[project.urls]
Homepage = "https://github.com/narayana006/kafka-client-config-lint"

[tool.setuptools]
packages = ["kafka_client_config_lint"]
