# Illustrative Spring Boot application.properties
spring.application.name=billing
spring.kafka.bootstrap-servers=broker-1.example.com:9092
spring.kafka.properties.security.protocol=SASL_SSL
spring.kafka.producer.acks=all
spring.kafka.producer.retries=0
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.consumer.group-id=billing
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.isolation-level=read_committed
spring.kafka.consumer.heartbeat-interval=3s
